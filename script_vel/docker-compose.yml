version: '3.8'

services:
  oracle-db-vel:
    container_name: oracle-enterprise-vel
    image: container-registry.oracle.com/database/enterprise:19.3.0.0
    restart: always
    ports:
      - "1524:1521"
    environment:
      ORACLE_SID: ORLCDV
      ORACLE_PDB: WINTVEL
      ORACLE_PWD: "S3nh4Admin01"
      INIT_SGA_SIZE: 8192
      INIT_PGA_SIZE: 2048
      INIT_CPU_COUNT: 4
      INIT_PROCESSES: 900
      ORACLE_EDITION: "enterprise"
      ORACLE_CHARACTERSET: "WE8MSWIN1252"
      ENABLE_ARCHIVELOG: "true"
      ENABLE_FORCE_LOGGING: "true"
      ENABLE_TCPS: "true"
    volumes:
      - /u02/oradat:/opt/oracle/oradata
      - /u02/SetupOracle/scripts_vel:/scripts:rw
      - /u02/SetupOracle/dump:/dump:rw
